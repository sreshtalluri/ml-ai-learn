title: K-nearest neighbors
lesson: k-nearest-neighbors
questions:
  - id: knn-euclid
    type: numeric
    difficulty: easy
    prompt: What is the Euclidean distance between $q = (1, 2)$ and $x = (4, 6)$?
    answer: 5
    tolerance: 0.001
    explanation: |
      Differences are $3$ and $4$. $\sqrt{3^2 + 4^2} = \sqrt{9 + 16} = \sqrt{25} = 5$.

  - id: knn-manhattan
    type: numeric
    difficulty: easy
    prompt: What is the Manhattan distance between $q = (1, 2, 0)$ and $x = (4, 6, -2)$?
    answer: 9
    tolerance: 0.001
    explanation: |
      $|1-4| + |2-6| + |0-(-2)| = 3 + 4 + 2 = 9$.

  - id: knn-vote
    type: single
    difficulty: medium
    prompt: |
      The five nearest neighbors of a query, from nearest to farthest, have labels `[1, 0, 0, 1, 0]`. What do K = 1, K = 3, and K = 5 predict?
    options:
      - "1, 0, 0"
      - "1, 1, 0"
      - "0, 0, 0"
      - "1, 0, 1"
    answer: 0
    explanation: |
      K = 1 uses only the nearest label, 1. K = 3 uses `[1, 0, 0]`, majority 0. K = 5 uses `[1, 0, 0, 1, 0]`: three 0s and two 1s, majority 0.

  - id: knn-scaling
    type: single
    difficulty: medium
    prompt: |
      Features are `age` (20 to 70) and `annual_income` in dollars (20,000 to 200,000). You run KNN without scaling. What happens?
    options:
      - Nothing; KNN is scale-invariant.
      - Distances are dominated by income, so the model effectively ignores age.
      - Distances are dominated by age because it has fewer distinct values.
      - The model raises an error about mismatched units.
    answer: 1
    explanation: |
      An income gap of 10,000 contributes $10{,}000^2$ to the squared distance, while the largest possible age gap contributes $50^2 = 2{,}500$. Income decides who the neighbors are. Standardize features first.
    why_not:
      - Distance-based models are very sensitive to scale; tree models are the scale-invariant ones.
      - Correct.
      - The number of distinct values does not matter; the magnitude of the differences does.
      - Nothing checks units. The failure is silent, which is what makes it dangerous.

  - id: knn-k-tradeoff
    type: match
    difficulty: medium
    prompt: Match each setting to its typical behavior.
    pairs:
      - ["K = 1", "Zero training error, high variance, jagged boundary"]
      - ["K = n (all points)", "Always predicts the majority class"]
      - ["K chosen by cross-validation", "Balances bias and variance on held-out folds"]
      - ["Distance-weighted votes", "Closer neighbors have more influence"]
    explanation: |
      K = 1 memorizes; K = n ignores the query entirely (every query has the same neighbors). Cross-validation picks K on data the model did not see, and distance weighting softens the cutoff at the K-th neighbor.

  - id: knn-debug
    type: multi
    difficulty: hard
    prompt: |
      A KNN fraud model looked great in a notebook but in production it is slow (300 ms per request) and its precision dropped. Training data is 4 million transactions with 120 raw features. Which changes address real causes? Select all that apply.
    options:
      - Use an approximate nearest-neighbor index instead of brute-force search.
      - Reduce or select features (or learn an embedding) to fight the curse of dimensionality.
      - Check that production features are scaled with the training-set mean and standard deviation.
      - Increase K to 4 million to use all the data.
    answer: [0, 1, 2]
    explanation: |
      Brute force is $O(np)$ per query: 4M × 120 operations. ANN indexes cut that dramatically. With 120 raw features, distances concentrate and become less informative. A classic production bug is training-serving skew: the notebook scaled features but the service sends raw values.
    why_not:
      - Correct. ANN search (HNSW, IVF) is the standard fix for latency.
      - Correct. Fewer, more relevant dimensions make distances meaningful again.
      - Correct. Unscaled production inputs would silently change every neighbor set.
      - K = n predicts the majority class for every request, which destroys recall on fraud.

  - id: knn-leakage
    type: single
    difficulty: medium
    prompt: |
      Which pipeline avoids leakage when choosing K with 5-fold cross-validation?
    options:
      - Standardize all data, then run cross-validation on KNN.
      - Put StandardScaler and KNN in one pipeline and cross-validate the pipeline.
      - Standardize the test set using its own mean and standard deviation.
      - Skip scaling during cross-validation and add it only in production.
    answer: 1
    explanation: |
      Inside a pipeline, each fold fits the scaler on its training portion only, so validation folds never influence the statistics used to transform them.
    why_not:
      - The scaler saw the validation folds, a mild but real leak.
      - Correct.
      - Test data must use training statistics; using its own is both a leak and a mismatch with production.
      - Then cross-validation measures a different model from the one you deploy.

  - id: knn-dims
    type: short
    difficulty: hard
    prompt: |
      Explain in your own words why KNN tends to get worse as you add many features, even if each new feature is only slightly noisy.
    sample_answer: |
      Every feature adds a term to every distance. Irrelevant or noisy features add random amounts that swamp the few informative ones. In high dimensions, distances between random points also concentrate: the nearest and the farthest neighbor end up almost equally far, so "nearest" carries little information. The fix is fewer, better features or a learned lower-dimensional representation.
    explanation: This is the curse of dimensionality, and it affects every distance-based method, including K-means.
