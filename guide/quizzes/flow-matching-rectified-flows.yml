title: Flow matching and rectified flows
lesson: flow-matching-rectified-flows
questions:
  - id: fm-target
    type: single
    difficulty: easy
    prompt: With $x_t = (1 - t)x_0 + t x_1$ ($x_0$ data, $x_1$ noise), what does a conditional flow-matching network regress onto?
    options:
      - The noise $x_1$
      - The velocity $x_1 - x_0$
      - The data $x_0$
      - The log-likelihood of $x_t$
    answer: 1
    explanation: The time derivative of the straight-line interpolant is the constant $x_1 - x_0$.
    why_not:
      - That's the epsilon-prediction target of DDPM; it carries the same information but is not the flow-matching target.
      - ""
      - That's the x0-prediction target.
      - Flow matching never computes a likelihood during training.
  - id: fm-xt-calc
    type: numeric
    difficulty: easy
    prompt: $x_0 = 2.0$, $x_1 = -0.5$, $t = 0.25$. What is $x_t = (1 - t)x_0 + t x_1$?
    answer: 1.375
    tolerance: 0.001
    explanation: $0.75 \times 2.0 + 0.25 \times (-0.5) = 1.5 - 0.125 = 1.375$. The target velocity is $-0.5 - 2.0 = -2.5$.
  - id: fm-x0-hat
    type: numeric
    difficulty: medium
    prompt: At $t = 0.6$, $x_t = 0.8$, the model predicts $v = -1.5$. What is its implied clean-data prediction $\hat{x}_0 = x_t - t\,v$?
    answer: 1.7
    tolerance: 0.001
    explanation: $0.8 - 0.6 \times (-1.5) = 0.8 + 0.9 = 1.7$.
  - id: fm-one-step
    type: numeric
    difficulty: hard
    prompt: |
      A flow-matching model trained with independent (random) pairs reaches the ideal velocity field. The data is a 50/50 mixture of modes at 1 and 5. Starting from noise $x_1 = 0.7$ at $t = 1$, where does a single Euler step of size 1 land?
    answer: 3
    tolerance: 0.001
    explanation: At $t = 1$, $v^*(x, 1) = x - \mathbb{E}[x_0] = 0.7 - 3 = -2.3$. One step gives $0.7 - (-2.3) = 3$, the data mean, which lies between the modes.
  - id: fm-loss-floor
    type: single
    difficulty: medium
    prompt: A flow-matching model's training loss plateaus well above zero, yet 32-step samples match the data. Why?
    options:
      - The model is underfitting and needs more layers
      - Many pairs pass through the same $(x_t, t)$ with different velocities, so the best prediction is their average and the leftover variance can't be removed
      - The learning rate is too high
      - The noise is not Gaussian
    answer: 1
    explanation: Squared loss converges to the conditional mean; its floor is the conditional variance of $x_1 - x_0$ given $x_t$.
    why_not:
      - Good samples show the field is learned; the floor is irreducible.
      - ""
      - A too-high learning rate shows up as noisy or diverging loss, not a stable floor with good samples.
      - Gaussian noise doesn't remove crossing lines.
  - id: fm-reflow
    type: single
    difficulty: medium
    prompt: What does one round of reflow (rectified flow) do?
    options:
      - Trains with a larger learning rate
      - Generates (noise, sample) pairs by solving the current model's ODE, then retrains on those coupled pairs so paths become straighter
      - Adds a discriminator
      - Doubles the number of sampling steps
    answer: 1
    explanation: Coupled pairs come from a non-crossing flow, so their straight lines rarely cross, and few-step sampling works.
    why_not:
      - Learning rate doesn't change path geometry.
      - ""
      - That's adversarial training, a different technique.
      - The goal is fewer steps, not more.
  - id: fm-blurry
    type: single
    difficulty: hard
    prompt: Your flow-matching image model looks great at 30 steps but blurry and averaged at 1 step. What is the best explanation and fix?
    options:
      - The decoder is broken; retrain the autoencoder
      - With random pairs, paths curve and one big step heads to the conditional mean; use reflow, a better solver, or few-step distillation
      - Guidance scale is too low
      - The model needs more training on t near 0
    answer: 1
    explanation: One Euler step from noise approximates the data mean. Straighter paths or distillation fix it.
    why_not:
      - The decoder works at 30 steps, so it isn't the problem.
      - ""
      - Guidance changes prompt adherence, not the curvature error of large steps.
      - The problem is at large steps from t near 1, not accuracy near data.
  - id: fm-diffusion-relation
    type: single
    difficulty: medium
    prompt: How does rectified flow relate to Gaussian diffusion $x_t = \alpha_t x_0 + \sigma_t \epsilon$?
    options:
      - They are unrelated families of models
      - Rectified flow is the special case $\alpha_t = 1 - t$, $\sigma_t = t$, with a velocity-prediction output; noise, data, and velocity predictions can be converted into each other
      - Rectified flow requires adversarial training
      - Diffusion is deterministic and rectified flow is stochastic
    answer: 1
    explanation: $v = \epsilon - x_0$, $\hat{x}_0 = x_t - t v$, $\hat\epsilon = x_t + (1 - t)v$.
    why_not:
      - Both define Gaussian paths between data and noise.
      - ""
      - It's trained with plain regression.
      - It's usually the other way round; flow matching is typically sampled with a deterministic ODE.
  - id: fm-time-sampling
    type: single
    difficulty: medium
    prompt: Why did SD3 sample training times from a logit-normal distribution instead of uniformly?
    options:
      - To make training deterministic
      - To spend more training on middle times, where predicting the velocity is hardest, and less near $t = 0$ and $t = 1$ where it is easy
      - Because uniform sampling is not differentiable
      - To avoid needing noise at all
    answer: 1
    explanation: Near the ends the target is nearly predictable from $x_t$ alone; the middle is where the model must decide what the image becomes.
    why_not:
      - Any time distribution is random.
      - ""
      - Time is sampled, not differentiated through.
      - The interpolant still needs noise.
  - id: fm-convention
    type: single
    difficulty: hard
    prompt: You load a checkpoint trained with noise at $t = 0$ and data at $t = 1$ into a sampler that assumes data at $t = 0$. What goes wrong?
    options:
      - Nothing; conventions don't matter
      - The sampler feeds the wrong times and steps against the velocity's sign, so samples are garbage; map $t \to 1 - t$ and negate $v$
      - Samples are correct but slower
      - Only the guidance scale needs to change
    answer: 1
    explanation: The math is the same up to $t \to 1 - t$ and a sign flip on $v$, but mixing them breaks sampling.
    why_not:
      - The direction of time is baked into the network's inputs and outputs.
      - ""
      - Wrong times and signs change the result, not just speed.
      - Guidance can't fix reversed time.
