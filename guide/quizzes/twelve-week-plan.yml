title: The 12-week plan
lesson: twelve-week-plan
questions:
  - id: plan-hours
    type: numeric
    difficulty: easy
    prompt: At 6 hours per week for 12 weeks, with half of each week spent building, how many hours go to deliverables in total?
    answer: 36
    tolerance: 0
    explanation: $12 \times 6 \times 0.5 = 36$.
  - id: plan-passes
    type: order
    difficulty: easy
    prompt: Order the three passes for studying a topic.
    options:
      - "Intuition: mental model and figures"
      - "Mechanics: worked examples by hand, then code"
      - "Engineering: build, compare against a baseline, explain trade-offs"
    explanation: Understanding before mechanics, mechanics before engineering.
  - id: plan-test
    type: multi
    difficulty: medium
    prompt: According to the teaching test, which show that you understand a concept? Select all that apply.
    options:
      - You can explain it simply
      - You can calculate a small example by hand
      - You can implement it
      - You can diagnose when it fails
    answer: [0, 1, 2, 3]
    explanation: All four together.
  - id: plan-recall
    type: single
    difficulty: easy
    prompt: What is active recall?
    options:
      - Re-reading the lesson until it feels familiar
      - Answering questions from memory before looking at the material, then reviewing what you missed
      - Watching videos at double speed
      - Highlighting key sentences
    answer: 1
    explanation: Retrieval practice beats re-reading for retention.
  - id: plan-baseline
    type: single
    difficulty: medium
    prompt: Why should every weekly deliverable include a simple baseline?
    options:
      - Baselines are required by scikit-learn.
      - Without one, you can't tell whether the model's score is good or whether the problem is just easy.
      - Baselines always win.
      - To make the README longer.
    answer: 1
    explanation: A score means something only relative to what a trivial approach achieves.
  - id: plan-behind
    type: short
    difficulty: medium
    prompt: You're two weeks behind. What is a better response than skipping weeks?
    sample_answer: |
      Keep the weekly rhythm but cut scope: do the lesson's hand-worked example and quiz, and a smaller version of the deliverable (one dataset, one model versus the baseline, a short write-up). Consistency matters more than completeness; skipped weeks break the chain of prerequisites.
    explanation: Cut scope, not rhythm.
