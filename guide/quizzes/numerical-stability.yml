title: Numerical stability
lesson: numerical-stability
questions:
  - id: ns-fp32-range
    type: single
    difficulty: easy
    prompt: What is the approximate largest finite value in float32?
    options:
      - "$1.8 \\times 10^{308}$"
      - "$3.4 \\times 10^{38}$"
      - "$10^{10}$"
      - "65,504"
    answer: 1
    explanation: float32 has 8 exponent bits, giving a max of about $3.4 \times 10^{38}$.
    why_not:
      - That is float64's max (11 exponent bits).
      - Correct.
      - No standard float format tops out there.
      - That is float16's max (5 exponent bits).
  - id: ns-point-one
    type: single
    difficulty: easy
    prompt: Why does `0.1 + 0.2 == 0.3` return False in Python?
    options:
      - The CPU's adder has a bug
      - 0.1 and 0.2 have no exact binary representation, so each is stored rounded and the rounded sum differs from rounded 0.3
      - Python rounds decimals to integers
      - 0.3 is not a valid float
    answer: 1
    explanation: 0.1 is a repeating fraction in base 2, like 1/3 in base 10. The sum is 0.30000000000000004. Compare floats with a tolerance, such as `math.isclose`.
    why_not:
      - The hardware follows IEEE 754 exactly; this is the specified behaviour.
      - Correct.
      - Python floats keep about 16 significant digits.
      - 0.3 is stored fine, just also rounded, and to a different neighbour than the sum.
  - id: ns-max-subtract
    type: single
    difficulty: medium
    prompt: In a stable softmax, why subtract max(z) from the logits before exponentiating?
    options:
      - It normalizes the logits to zero mean
      - It converts the logits to float16
      - It makes the output more uniform
      - The largest exponent becomes $e^0 = 1$, so nothing overflows, and the output is unchanged because softmax is shift-invariant
    answer: 3
    explanation: "$\\text{softmax}(z - c) = \\text{softmax}(z)$ for any constant $c$. With $c = \\max z$ every term is at most 1 and the denominator is at least 1."
    why_not:
      - Subtracting the max doesn't center the logits; subtracting the mean would, and it would not guarantee no overflow.
      - It changes no types.
      - The probabilities are identical to the exact softmax.
      - Correct.
  - id: ns-lse-calc
    type: numeric
    difficulty: medium
    prompt: Compute $\log(e^{3} + e^{1} + e^{-2})$ using the max trick. Give 3 decimals.
    answer: 3.133
    tolerance: 0.002
    explanation: |
      $m = 3$. $e^{0} + e^{-2} + e^{-5} = 1 + 0.1353 + 0.0067 = 1.1420$. $\ln 1.1420 = 0.1328$. LSE $= 3.1328$.
  - id: ns-h-too-small
    type: single
    difficulty: medium
    prompt: You use $h = 10^{-15}$ in a centered-difference gradient check in float64. What happens?
    options:
      - The estimate becomes more accurate
      - The gradient becomes exactly 0
      - "$f(x+h)$ and $f(x-h)$ agree in almost every digit, so their difference is mostly rounding noise and the estimate is badly wrong"
      - The function evaluates faster
    answer: 2
    explanation: Error behaves like $h^2 + \varepsilon/h$. At $h = 10^{-15}$ the $\varepsilon/h$ term is about 0.2. The sweet spot is near $\varepsilon^{1/3} \approx 6 \times 10^{-6}$.
    why_not:
      - Only the truncation error shrinks; rounding error grows as $1/h$ and dominates.
      - It can be 0 by accident, but generally it's noise of either sign.
      - Correct.
      - Speed doesn't depend on $h$.
  - id: ns-bf16
    type: single
    difficulty: medium
    prompt: Why is bfloat16 usually preferred over float16 for training?
    options:
      - bf16 uses less memory
      - bf16 has float32's exponent range, so large activations don't overflow and small gradients don't flush to zero, usually without loss scaling
      - bf16 has more fraction bits than fp16
      - bf16 is supported by every GPU
    answer: 1
    explanation: bf16 has 8 exponent bits (max about $3.4 \times 10^{38}$); fp16 has 5 (max 65,504, smallest subnormal about $6 \times 10^{-8}$).
    why_not:
      - Both are 16 bits.
      - Correct.
      - bf16 has 7 fraction bits; fp16 has 10. bf16 is less precise.
      - Older GPUs (before NVIDIA Ampere, for example) lack fast bf16 support, which is when fp16 with a scaler is used.
  - id: ns-nan-diagnosis
    type: single
    difficulty: hard
    prompt: Your hand-written loss is `-torch.log(torch.softmax(logits, -1)[range(n), y]).mean()`. Training runs fine for a while, then the loss is `inf` and then `NaN`. What is the most likely cause and fix?
    options:
      - The learning rate is too low; raise it
      - A logit gap grew large enough that the true class's probability underflowed to 0, and log(0) is −inf; use F.cross_entropy on the logits
      - Softmax overflowed because the max wasn't subtracted; torch.softmax doesn't do it
      - The labels are one-hot encoded
    answer: 1
    explanation: torch.softmax is already shift-stable, but a probability of $e^{-200}$ still rounds to 0 in float32. Computing log-softmax as $z_y - \text{LSE}(z)$ never forms the probability.
    why_not:
      - A low LR doesn't produce inf; it just learns slowly.
      - Correct.
      - torch.softmax subtracts the max internally; overflow isn't the issue, underflow before the log is.
      - The indexing with y implies integer labels, and wrong label format would fail immediately, not after a while.
  - id: ns-loss-scale
    type: numeric
    difficulty: hard
    prompt: fp16's smallest positive subnormal is about $5.96 \times 10^{-8}$. A gradient of $2 \times 10^{-9}$ must be at least that size after scaling. What is the smallest power-of-two loss scale that achieves this?
    answer: 32
    tolerance: 0
    explanation: Need $S \ge 5.96 \times 10^{-8} / 2 \times 10^{-9} = 29.8$. The smallest power of two above 29.8 is 32. (Real scalers start much larger, e.g. 65,536, and back off on overflow.)
  - id: ns-variance-design
    type: single
    difficulty: medium
    prompt: You need the variance of a float32 feature whose values are around 10,000 with spread around 1. Which approach do you use?
    options:
      - "$\\mathbb{E}[x^2] - \\mathbb{E}[x]^2$ in float32, since it needs only one pass"
      - Subtract the mean first (two-pass or Welford's online algorithm), or accumulate in float64
      - Cast to float16 to save memory
      - Add 1e-8 to the result
    answer: 1
    explanation: Both terms of the one-pass formula are about $10^8$, where float32 spacing is 8, so their difference is noise; the script gets −8 for a true 1.25. Centering first removes the large common part.
    why_not:
      - This is catastrophic cancellation; it can even return a negative variance.
      - Correct.
      - float16 can't even represent the squares (max 65,504).
      - An epsilon doesn't fix an error of ±8.
