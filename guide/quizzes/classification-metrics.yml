title: Classification metrics and thresholds
lesson: classification-metrics
questions:
  - id: cm-precision
    type: numeric
    difficulty: easy
    prompt: TP = 40, FP = 10, FN = 20, TN = 930. What is precision?
    answer: 0.8
    tolerance: 0.0001
    explanation: $40 / (40 + 10) = 0.8$.
  - id: cm-recall
    type: numeric
    difficulty: easy
    prompt: Same counts (TP = 40, FP = 10, FN = 20, TN = 930). What is recall? (4 decimals)
    answer: 0.6667
    tolerance: 0.001
    explanation: $40 / (40 + 20) = 0.667$.
  - id: cm-f1
    type: numeric
    difficulty: medium
    prompt: Precision 0.8 and recall 0.6667. What is F1? (4 decimals)
    answer: 0.7273
    tolerance: 0.001
    explanation: $2(0.8)(0.6667)/(0.8 + 0.6667) = 1.0667/1.4667 = 0.727$.
  - id: cm-threshold
    type: single
    difficulty: medium
    prompt: You lower the classification threshold from 0.5 to 0.2. What usually happens?
    options:
      - Precision rises and recall falls.
      - Recall rises and false positives increase.
      - Both precision and recall rise.
      - Nothing; thresholds don't affect metrics.
    answer: 1
    explanation: More examples are flagged, so more true positives are caught but more negatives are flagged too.
  - id: cm-cost
    type: numeric
    difficulty: hard
    prompt: At threshold A there are 30 FP and 5 FN; at threshold B, 8 FP and 12 FN. A false negative costs 20 and a false positive costs 2. What is the cost of the cheaper threshold?
    answer: 160
    tolerance: 0
    explanation: A $= 30(2) + 5(20) = 160$. B $= 8(2) + 12(20) = 256$. A is cheaper at 160.
  - id: cm-imbalance
    type: multi
    difficulty: medium
    prompt: On a dataset with 0.5% positives, which metrics are most informative? Select all that apply.
    options:
      - Accuracy
      - Precision and recall at the operating threshold
      - Precision-recall AUC (average precision)
      - Expected cost at the chosen threshold
    answer: [1, 2, 3]
    explanation: Always predicting negative gives 99.5% accuracy, so accuracy says almost nothing here.
  - id: cm-calibration
    type: short
    difficulty: hard
    prompt: Two models have the same ROC AUC, but one is badly overconfident. When does that matter, and what would you do?
    sample_answer: |
      AUC only measures ranking, so for "flag the top N" decisions they behave the same. It matters whenever probabilities are used as probabilities: expected-cost thresholds, risk scores shown to users, combining models, or comparing across segments. Check a reliability diagram and recalibrate on held-out data with Platt scaling or isotonic regression.
    explanation: Ranking quality and calibration are different properties.
