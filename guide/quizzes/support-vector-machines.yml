title: Support vector machines
lesson: support-vector-machines
questions:
  - id: svm-margin
    type: numeric
    difficulty: medium
    prompt: A linear SVM has $w = (6, 8)$. What is the margin width $2/\lVert w\rVert$?
    answer: 0.2
    tolerance: 0.0001
    explanation: $\lVert w\rVert = \sqrt{36 + 64} = 10$; $2/10 = 0.2$.
  - id: svm-hinge
    type: numeric
    difficulty: medium
    prompt: For $y = -1$ and $f(x) = 0.3$, what is the hinge loss $\max(0, 1 - y f(x))$?
    answer: 1.3
    tolerance: 0.0001
    explanation: $y f(x) = -0.3$; $1 - (-0.3) = 1.3$. The point is on the wrong side.
  - id: svm-rbf
    type: numeric
    difficulty: medium
    prompt: RBF kernel with $\gamma = 1$ between points at squared distance 2. What is $K$? (4 decimals)
    answer: 0.1353
    tolerance: 0.0005
    explanation: $e^{-2} = 0.1353$.
  - id: svm-c
    type: single
    difficulty: medium
    prompt: You increase C from 0.1 to 1000. What typically happens?
    options:
      - The margin widens and the model becomes more regularized.
      - The margin narrows as the model tries harder to classify every training point, risking overfitting.
      - Nothing changes for a linear kernel.
      - The number of support vectors always increases.
    answer: 1
    explanation: C is the price of each margin violation. A high price forces a narrower, more complex fit.
  - id: svm-sv
    type: single
    difficulty: easy
    prompt: A training point is correctly classified and well outside the margin. If you delete it and retrain, what happens to the boundary?
    options:
      - It changes a lot.
      - It doesn't change; only support vectors determine the solution.
      - It flips.
      - The margin doubles.
    answer: 1
    explanation: Its hinge loss is zero, so it has no influence on the optimum.
  - id: svm-when
    type: multi
    difficulty: hard
    prompt: When is an SVM a reasonable choice? Select all that apply.
    options:
      - Linear SVM on 200,000 TF-IDF features for text classification
      - RBF SVM on 5,000 examples with a curved boundary
      - RBF SVM on 50 million rows
      - When you need well-calibrated probabilities out of the box
    answer: [0, 1]
    explanation: Kernel SVMs scale poorly to huge n, and SVM scores need extra calibration to be probabilities.
