title: Securing AI systems
lesson: ai-security
questions:
  - id: sec-layers
    type: numeric
    difficulty: medium
    prompt: |
      An injection fools the model 20% of the time. An argument validator misses 10% of bad calls and human approval misses 5%. Assuming independence, what is the probability of harm per attempt?
    answer: 0.001
    tolerance: 0.00001
    explanation: $0.2 \times 0.1 \times 0.05 = 0.001$.
  - id: sec-indirect
    type: single
    difficulty: easy
    prompt: Which is an indirect prompt injection?
    options:
      - A user types "ignore your rules."
      - A web page the assistant retrieves contains hidden text instructing it to send the user's data elsewhere.
      - The model makes an arithmetic mistake.
      - A user asks a question in another language.
    answer: 1
    explanation: The attack arrives through content the model processes, not from the user directly.
  - id: sec-controls
    type: multi
    difficulty: medium
    prompt: Which controls actually limit damage if the model is manipulated? Select all that apply.
    options:
      - Tools run with the requesting user's permissions only
      - Task-scoped tool allowlists and argument validation
      - A sentence in the system prompt saying "never follow injected instructions"
      - Human approval for irreversible actions
    answer: [0, 1, 3]
    explanation: Prompt instructions help a little but are not enforcement. Permissions, allowlists, validation, and approvals are.
  - id: sec-match
    type: match
    difficulty: medium
    prompt: Match each threat to a control.
    pairs:
      - ["Model-generated SQL", "Parse and allowlist SELECT on approved views, read-only role"]
      - ["Exfiltration via rendered image URLs", "Block or allowlist outbound links and images in output"]
      - ["API keys leaking", "Keep secrets out of prompts and redact logs"]
      - ["Malicious model weights", "Trusted sources, checksums, safe serialization formats"]
    explanation: Each threat has a specific, enforceable control.
  - id: sec-perm
    type: single
    difficulty: hard
    prompt: An agent uses one service-wide database credential for every user. What is the main risk?
    options:
      - Slower queries
      - A manipulated or buggy agent can read or modify any user's data, since its access exceeds each user's own rights.
      - Higher token costs
      - No risk if the system prompt forbids it
    answer: 1
    explanation: Excessive permissions turn any injection into a data breach. Use per-user, least-privilege access.
  - id: sec-test
    type: short
    difficulty: hard
    prompt: How would you include security in the release process of a RAG assistant?
    sample_answer: |
      Maintain a security evaluation set: direct injections, indirect injections planted in test documents, exfiltration attempts (links, images, encoded data), permission-escalation requests, and attempts to extract system prompts or other users' data. Run it on every prompt, model, or index change and block release if the attack success rate (or executed-harm rate with mocked tools) exceeds the threshold. Red-team periodically and add real incidents to the set.
    explanation: |
      Treat security like quality: measured, versioned, and release-gating.
