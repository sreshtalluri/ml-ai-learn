title: Vector search
lesson: vector-search
questions:
  - id: vs-ivf-scan
    type: numeric
    difficulty: medium
    prompt: |
      An IVF index holds $N = 2{,}000{,}000$ vectors in $n_{\text{list}} = 2000$ balanced cells. With $n_{\text{probe}} = 10$, how many distance computations does one query make in total (centroids plus scanned vectors)?
    answer: 12000
    tolerance: 0
    explanation: |
      Centroids: 2,000. Scanned: $\frac{10}{2000} \times 2{,}000{,}000 = 10{,}000$. Total $= 12{,}000$, versus 2,000,000 for brute force (0.6%).
  - id: vs-pq-mem
    type: numeric
    difficulty: medium
    prompt: |
      How many MB (decimal) do PQ codes take for 5,000,000 vectors of dimension 1536 with $m = 192$ one-byte subvector codes? (Ignore codebooks.)
    answer: 960
    tolerance: 0
    explanation: |
      $5{,}000{,}000 \times 192 = 960{,}000{,}000$ bytes $= 960$ MB. Raw float32 would be $5{,}000{,}000 \times 1536 \times 4 = 30.72$ GB, a $32\times$ compression.
  - id: vs-rrf
    type: numeric
    difficulty: medium
    prompt: |
      With RRF and $c = 60$, a document is ranked 2nd by dense search and 5th by BM25. What is its fused score? (5 decimals)
    answer: 0.03151
    tolerance: 0.00002
    explanation: |
      $\frac{1}{62} + \frac{1}{65} = 0.016129 + 0.015385 = 0.031514$.
  - id: vs-recall
    type: numeric
    difficulty: easy
    prompt: |
      Brute-force top-5 is {A, B, C, D, E}. The ANN index returns {A, C, E, X, Y}. What is recall@5?
    answer: 0.6
    tolerance: 0
    explanation: Overlap is {A, C, E}, so $3/5 = 0.6$.
  - id: vs-metric
    type: single
    difficulty: medium
    prompt: |
      All stored and query embeddings are normalized to length 1. Which statement is true?
    options:
      - Cosine, dot product, and L2 distance produce the same ranking.
      - Dot product ranks longer vectors higher, so it differs from cosine.
      - L2 distance must be used because cosine is undefined for unit vectors.
      - Only cosine is correct; dot product would need re-normalizing per query.
    answer: 0
    explanation: |
      For unit vectors, $\cos = \text{dot}$ and $\lVert q - x\rVert^2 = 2 - 2\cos$, a decreasing function of cosine. All three rank identically, so use the cheapest (dot).
    why_not:
      - Correct.
      - All vectors have the same length, so length can't change the ranking.
      - Cosine is well defined for any non-zero vector.
      - Dot product already equals cosine for unit vectors.
  - id: vs-filter
    type: single
    difficulty: hard
    prompt: |
      A tenant owns 0.5% of the vectors. Search retrieves the global top 20, then drops other tenants' results. Users of this tenant usually get nothing. What is the best fix?
    options:
      - Increase nprobe.
      - Apply the tenant filter inside the search (pre-filtering or a per-tenant index), or brute-force the tenant's small subset.
      - Switch from cosine to dot product.
      - Ask the LLM to ignore documents from other tenants.
    answer: 1
    explanation: |
      Post-filtering keeps on average $20 \times 0.005 = 0.1$ results. The filter must constrain the search itself; for a tiny subset, exact search over it is cheap and perfect.
    why_not:
      - More probes improve recall of the global top 20, which is still mostly other tenants.
      - Correct.
      - The metric doesn't change which tenant the results belong to.
      - Access control must never depend on the model; the data shouldn't reach it.
  - id: vs-reindex
    type: single
    difficulty: medium
    prompt: |
      You switch to a better embedding model with the same dimension (768). What must happen to the existing index?
    options:
      - Nothing, since the dimension matches.
      - Re-embed the whole corpus with the new model and rebuild the index, then switch queries over.
      - Only new documents need the new model.
      - Normalize the old vectors so they match the new model.
    answer: 1
    explanation: |
      Different models define different vector spaces. Queries from the new model compared with documents from the old one give meaningless similarities. Re-embed everything, ideally as a blue-green migration.
    why_not:
      - Same shape does not mean the same space.
      - Correct.
      - Mixed spaces make similarity scores incomparable.
      - Normalization fixes length, not the coordinate system.
  - id: vs-choose
    type: multi
    difficulty: hard
    prompt: |
      Which situations favor plain exact (brute-force) search over an ANN index? Select all that apply.
    options:
      - 50,000 vectors, a few queries per second.
      - Queries always filtered to a subset of a few thousand vectors.
      - 500 million vectors, 2,000 queries per second, tight memory budget.
      - Building an evaluation set to measure an ANN index's recall.
    answer: [0, 1, 3]
    explanation: |
      Small collections and small filtered subsets are cheap to scan exactly, and exact search is the ground truth for measuring ANN recall. Hundreds of millions of vectors at high QPS need an ANN index, likely with compression.
    why_not:
      - Correct.
      - Correct.
      - This scale is exactly what IVF-PQ or HNSW are for.
      - Correct.
  - id: vs-hnsw-knob
    type: short
    difficulty: medium
    prompt: |
      Your HNSW index has recall@10 of 0.85 against brute force and latency to spare. Which knob do you change first, in which direction, and why?
    sample_answer: |
      Raise efSearch, the query-time candidate list size. It increases recall at the cost of latency without rebuilding the index. Only if recall still plateaus would I rebuild with a larger M or efConstruction, which costs memory and build time.
    explanation: efSearch is the per-query recall/latency knob; M and efConstruction require a rebuild.
