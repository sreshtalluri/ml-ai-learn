title: MDPs, states, actions, and rewards
lesson: mdps-states-actions-rewards
questions:
  - id: mdp-return
    type: numeric
    difficulty: easy
    prompt: An episode gives rewards $[0, 0, -1, 10]$ with $\gamma = 0.5$. What is the return $G_0$?
    answer: 1
    tolerance: 0.001
    explanation: |
      Work backward: $G_3 = 10$, $G_2 = -1 + 0.5 \times 10 = 4$, $G_1 = 0 + 0.5 \times 4 = 2$, $G_0 = 0 + 0.5 \times 2 = 1$.
  - id: mdp-horizon
    type: numeric
    difficulty: easy
    prompt: Using the rule of thumb $1/(1-\gamma)$, roughly how many steps ahead does an agent with $\gamma = 0.98$ look?
    answer: 50
    tolerance: 0.5
    explanation: $1 / (1 - 0.98) = 1 / 0.02 = 50$ steps.
  - id: mdp-bellman
    type: numeric
    difficulty: medium
    prompt: |
      Uniform random policy over 4 actions, $\gamma = 0.9$, every move costs $-1$. From cell $s$ the four actions lead to cells with values $-8$, $-6$, $-8$, and $0$ (the terminal goal). What is $V^\pi(s)$ according to the Bellman expectation equation?
    answer: -5.95
    tolerance: 0.001
    explanation: |
      Each action contributes $0.25 \times (-1 + 0.9\,V(s'))$: $-1 + 0.9 \times (-8) = -8.2$, $-1 + 0.9 \times (-6) = -6.4$, $-8.2$ again, and $-1 + 0 = -1$. Sum $= -23.8$; times $0.25$ gives $-5.95$.
  - id: mdp-markov
    type: single
    difficulty: medium
    prompt: An agent plays Pong from a single screen frame and can't learn to hit the ball. Which change addresses the root cause?
    options:
      - Increase the discount factor to 0.999.
      - Stack the last few frames (or use a recurrent network) so the state includes the ball's velocity.
      - Give a larger reward for hitting the ball.
      - Switch from Q-learning to a policy-gradient method.
    answer: 1
    explanation: One frame shows the ball's position but not its direction, so the state is not Markov. The fix belongs in the state representation.
    why_not:
      - A longer horizon doesn't add the missing velocity information.
      - ""
      - Reward shaping can't help if the agent can't tell which way the ball is moving.
      - Any algorithm struggles when two situations that need different actions look identical.
  - id: mdp-reward-value
    type: single
    difficulty: easy
    prompt: Which statement correctly separates reward, return, and value?
    options:
      - Reward and return are the same; value is the reward at the goal.
      - Reward is one step's number; return is the discounted sum over one episode; value is the expected return from a state.
      - Value is the reward the environment gives; return is what the agent predicts.
      - Return is the expected reward of the next step only.
    answer: 1
    explanation: Rewards are observed per step, returns are sums over one trajectory, and values average returns over everything the policy and environment might do.
    why_not:
      - Return sums many rewards, and value is an expectation, not a single reward.
      - ""
      - The environment gives rewards; values are what the agent estimates.
      - Return includes all future rewards, discounted, not just the next one.
  - id: mdp-gamma-one
    type: single
    difficulty: medium
    prompt: A continuing task (no terminal state, no time limit) uses $\gamma = 1$ and a reward of $+1$ per step. What goes wrong?
    options:
      - Nothing; $\gamma = 1$ is always the safest choice.
      - The agent becomes myopic.
      - Returns and values are unbounded, so value estimates diverge.
      - The Markov property is violated.
    answer: 2
    explanation: With no end and no discount the sum of rewards grows without limit. Use $\gamma < 1$ or a finite horizon.
    why_not:
      - $\gamma = 1$ is only safe when every episode is guaranteed to end.
      - Myopia comes from a small $\gamma$, not $\gamma = 1$.
      - ""
      - The Markov property concerns the state, not the discount.
  - id: mdp-hacking
    type: single
    difficulty: hard
    prompt: A summarization model trained with RL against a learned reward model starts writing longer and longer summaries, and human raters like them less. What is the most likely diagnosis?
    options:
      - The discount factor is too low.
      - Reward hacking. The policy exploits a bias in the reward model (it favors length), so the proxy reward rises while true quality falls.
      - The state is not Markov.
      - The learning rate is too high, so training diverged.
    answer: 1
    explanation: The policy optimizes the reward you wrote. Fixes include a KL penalty to the reference model, length-controlled rewards, retraining the reward model on the new failures, and held-out human evaluation.
    why_not:
      - Responses are short episodes, often with $\gamma = 1$; the discount isn't the issue.
      - ""
      - The context window is the state and is Markov by construction.
      - Divergence would look like collapse, not a steady drift toward one exploitable feature.
  - id: mdp-design
    type: single
    difficulty: medium
    prompt: You frame RL fine-tuning of an LLM on math problems with a checker that verifies the final answer. Which MDP formulation fits?
    options:
      - State is the last token; action is a whole response; reward is per-token perplexity.
      - State is the prompt plus tokens so far; action is the next token; reward is 1 at the end if the checker passes, else 0; $\gamma = 1$.
      - State is the checker's output; action is the prompt; reward is response length.
      - State is the model weights; action is a gradient step; reward is training loss.
    answer: 1
    explanation: This is the standard RL-with-verifiable-rewards setup. The reward is sparse (only at the end), so methods like GRPO compare several sampled answers per prompt.
    why_not:
      - The last token alone isn't Markov, and perplexity isn't the goal.
      - ""
      - Rewarding length invites reward hacking and doesn't match the goal.
      - That describes the optimizer, not the decision problem the policy faces.
  - id: mdp-vi-vs-pe
    type: single
    difficulty: medium
    prompt: How does value iteration differ from policy evaluation?
    options:
      - Value iteration takes a max over actions in the Bellman update; policy evaluation averages over the policy's action probabilities.
      - Value iteration needs no transition model; policy evaluation does.
      - Policy evaluation finds the optimal policy; value iteration only scores a fixed one.
      - They are the same algorithm with a different stopping rule.
    answer: 0
    explanation: Value iteration iterates the Bellman optimality equation and yields $V^*$; policy evaluation iterates the expectation equation for a fixed $\pi$.
    why_not:
      - ""
      - Both are dynamic programming and both need the model $P$ and $r$.
      - It's the other way round.
      - The max vs average is a real difference in what they compute.
